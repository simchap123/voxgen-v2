<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!--
    VoxGen logomark — matches voxgen.app brand (CLAUDE.md UI/brand, website tokens):
    sage primary hsl(152 32% 42%) #4C8C6B on a warm squircle, cream microphone hsl(40 33% 96%) #F8F4EC.
    Light/warm identity — deliberately NOT the dark+glow utility look.
  -->
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#589A77"/>
      <stop offset="1" stop-color="#3D7355"/>
    </linearGradient>
  </defs>

  <!-- Warm sage squircle -->
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#sage)"/>

  <!-- Microphone, cream -->
  <g fill="none" stroke="#F8F4EC" stroke-width="13" stroke-linecap="round">
    <!-- body (capsule) -->
    <rect x="104" y="58" width="48" height="84" rx="24" fill="#F8F4EC" stroke="none"/>
    <!-- cradle -->
    <path d="M82 116 a46 46 0 0 0 92 0"/>
    <!-- stem -->
    <path d="M128 162 V190"/>
    <!-- base -->
    <path d="M104 194 H152"/>
  </g>
</svg>
